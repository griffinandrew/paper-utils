[package]
name = "paper-utils"
version = "1.2.6"
edition = "2024"
license = "AGPL-3.0"
description = "A utility crate for PaperCache."
repository = "https://github.com/PaperCache/paper-utils.git"
readme = "README.md"
homepage = "https://papercache.io"
keywords = ["caching", "PaperCache"]
categories = ["caching"]

[dependencies]
byteorder = "1.5.0"
libc = "0.2.177"
smallvec = "1.15.1"
thiserror = "2.0.12"
tikv-jemallocator = "0.6.1"

[build-dependencies]
cc = "1.2.43"
bindgen = "0.72.1"


[features]
default = []
allocator_api = []
